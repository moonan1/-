name: APK 빌드

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 프로젝트 압축 풀기
        run: |
          ZIP=$(ls *.zip | sort -V | tail -1)
          echo "사용할 압축 파일: $ZIP"
          rm -rf SmartPillBox
          unzip -q -o "$ZIP"
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: APK 만들기
        working-directory: SmartPillBox/android
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then echo "주의: DATA_GO_KR_KEY 비밀값이 없어 약 검색이 꺼진 채로 빌드됩니다"; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: yaksok-apk
          path: SmartPillBox/android/app/build/outputs/apk/debug/*.apk
